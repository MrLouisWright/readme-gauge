name: 'readme-gauge'
description: 'Lint READMEs for required sections, broken badges, stale install commands and missing usage examples'
author: 'Louis Wright'
branding: { icon: 'book-open', color: 'blue' }
inputs:
  path: { description: 'Project directory (default: repository root)', default: '.' }
  require: { description: 'Comma-separated required sections (default: install,usage,license)', default: '' }
  check-links: { description: 'Also fetch external badge and link URLs (true/false)', default: 'false' }
  fail-on: { description: 'critical | high | medium | low | info | none', default: 'high' }
  config: { description: 'Path to JSON config file', default: '' }
  sarif: { description: 'Write SARIF to this path', default: '' }
  json: { description: 'Write JSON report to this path', default: '' }
  job-summary: { description: 'Write the Markdown report to the job summary (true/false)', default: 'true' }
  args: { description: 'Extra CLI arguments', default: '' }
outputs:
  markdown-file: { description: 'Path of the Markdown report', value: '${{ steps.run.outputs.markdown-file }}' }
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with: { node-version: '20' }
    - id: run
      shell: bash
      env:
        RG_PATH: ${{ inputs.path }}
        RG_REQUIRE: ${{ inputs.require }}
        RG_CHECK_LINKS: ${{ inputs.check-links }}
        RG_FAIL_ON: ${{ inputs.fail-on }}
        RG_CONFIG: ${{ inputs.config }}
        RG_SARIF: ${{ inputs.sarif }}
        RG_JSON: ${{ inputs.json }}
        RG_SUMMARY: ${{ inputs.job-summary }}
        RG_ARGS: ${{ inputs.args }}
        RG_BIN: ${{ github.action_path }}/bin/readme-gauge.js
      run: |
        md="$RUNNER_TEMP/readme-gauge.md"
        args=("$RG_PATH" --fail-on "$RG_FAIL_ON" --markdown "$md")
        [ -n "$RG_REQUIRE" ] && args+=(--require "$RG_REQUIRE")
        [ "$RG_CHECK_LINKS" = "true" ] && args+=(--check-links)
        [ -n "$RG_CONFIG" ] && args+=(--config "$RG_CONFIG")
        [ -n "$RG_SARIF" ] && args+=(--sarif "$RG_SARIF")
        [ -n "$RG_JSON" ] && args+=(--json "$RG_JSON")
        set +e
        # shellcheck disable=SC2086
        node "$RG_BIN" "${args[@]}" $RG_ARGS
        code=$?
        set -e
        echo "markdown-file=$md" >> "$GITHUB_OUTPUT"
        if [ "$RG_SUMMARY" = "true" ] && [ -f "$md" ]; then cat "$md" >> "$GITHUB_STEP_SUMMARY"; fi
        exit $code
